# Every push: the build without warnings and the tests.
# A tag v*: the release build is packed into Komora-<version>.zip (the exe, LICENSE, README, the font licence) plus the bare
# Komora-<version>.exe and published as a release right away.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build without warnings
        run: cargo build
        env:
          RUSTFLAGS: -D warnings

      - name: Tests
        run: cargo test

      - name: Release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release

      # The tag must name the version in Cargo.toml.
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $cv = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($cv -ne $v) { throw "tag $v, Cargo.toml $cv" }
          New-Item -ItemType Directory pack | Out-Null
          Copy-Item target/release/komora.exe pack/Komora.exe
          Copy-Item LICENSE, README.md pack/
          Copy-Item web/fonts/OFL.txt pack/OFL-Geist.txt
          Compress-Archive -Path pack/* -DestinationPath "Komora-$v.zip"
          Copy-Item target/release/komora.exe "Komora-$v.exe"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Komora-*.zip
            Komora-*.exe
          draft: false
